# Runs on every pull request and on pushes to main.
# lint: ruff. test: full pytest suite against a throwaway SQL Server container.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check --output-format github .

  test:
    runs-on: ubuntu-latest
    env:
      # Throwaway password for a container that exists only for this job; not a real credential.
      SA_PASSWORD: Ci-Only-Throwaway-1
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Only-Throwaway-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Only-Throwaway-1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ODBC Driver 18 for SQL Server (if missing)
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18 unixodbc-dev
          fi
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          COLUMBUS_HOUSING_SERVER: localhost,1433
          COLUMBUS_HOUSING_UID: sa
          COLUMBUS_HOUSING_PWD: ${{ env.SA_PASSWORD }}
        run: python -m pytest -q
