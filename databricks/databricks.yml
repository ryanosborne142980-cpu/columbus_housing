# Bronze layer on Databricks, deployed from code.
#   databricks bundle deploy -p columbus
#   databricks bundle run bronze -p columbus
bundle:
  name: columbus_housing

workspace:
  # Local CLI profile name; the workspace URL stays out of the repo.
  profile: columbus

variables:
  schema:
    description: Schema that holds the volume and tables
    default: columbus_housing

resources:
  schemas:
    columbus_housing:
      catalog_name: workspace
      name: ${var.schema}
      comment: Columbus-area housing data

  volumes:
    raw:
      catalog_name: workspace
      schema_name: ${resources.schemas.columbus_housing.name}
      name: raw
      volume_type: MANAGED
      comment: Source files exactly as received. Never edited, so bronze can be replayed.

  pipelines:
    bronze:
      name: ${var.schema}_bronze
      catalog: workspace
      schema: ${resources.schemas.columbus_housing.name}
      serverless: true
      continuous: false
      configuration:
        columbus.volume: /Volumes/workspace/${var.schema}/raw
      libraries:
        - file:
            path: pipelines/bronze.py
        - file:
            path: pipelines/silver.py

targets:
  dev:
    default: true

  # Separate schema for drift_test.py, so sample rows can't reach the real tables.
  test:
    variables:
      schema: columbus_housing_test
    resources:
      pipelines:
        bronze:
          libraries:
            - file:
                path: pipelines/drift_modes.py
